name: Build macOS app

# Builds Alchemy.dmg for Apple Silicon (arm64) with an embedded Java runtime.
# - every push / pull request: the .dmg is attached to the run as an artifact
# - push on master: if no release exists yet for the version in build.gradle,
#   the release v<version> is created with the .dmg (bump the version to publish)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the .dmg
        run: ./gradlew jpackage --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: Alchemy-macOS-arm64
          path: build/jpackage/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to publish"
          else
            gh release create "v$VERSION" build/jpackage/*.dmg \
              --target "$GITHUB_SHA" --title "Alchemy $VERSION" --generate-notes
          fi
